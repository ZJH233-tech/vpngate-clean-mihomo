#!/usr/sbin/nft -f
# nftables 模板(2026-09): 订阅走 Argo 加密隧道后, 订阅明文端口不再对公网开放。
# 把 <YOUR_SSH_PORT> 改成你加固时选定的非标 SSH 端口; 端口段按实际节点调整。
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        meta l4proto ipv6-icmp accept
        tcp dport <YOUR_SSH_PORT> accept
        tcp dport 443 accept
        udp dport 443 accept
        tcp dport 8388 accept
        tcp dport 8444 accept
        tcp dport 8445-8454 accept
        udp dport 20000-50000 accept
    }
    chain forward { type filter hook forward priority filter; policy accept; }
    chain output  { type filter hook output priority filter; policy accept; }
}

table inet nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        udp dport 20000-50000 redirect to :443
    }
}
